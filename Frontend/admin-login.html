<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | CCIRS</title>
    <meta name="description" content="CCIRS staff login for managing and resolving campus complaints.">
    <meta name="author" content="Team TriForge">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#174b3a" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e1613" media="(prefers-color-scheme: dark)">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f4d3a'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='17' font-weight='700' text-anchor='middle' fill='%23ffffff'%3EC%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23174b3a'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='18' font-weight='700' text-anchor='middle' fill='%23e9a23b'%3ET%3C/text%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
    <script src="app.js" defer></script>
  </head>

<body data-page="login">
  <a href="#main" class="skip-link">Skip to main content</a>

  <header class="site-header">
    <nav class="navbar container" aria-label="Main navigation">
      <a href="index.html" class="logo" aria-label="TriForge CCIRS home">
        <span class="logo-mark" aria-hidden="true">C</span>
        <span class="logo-text">CC<span>IRS</span></span>
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu"
        aria-label="Toggle navigation menu">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>

      <div class="nav-menu" id="nav-menu">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#features">Features</a></li>
          <li><a href="index.html#how-it-works">How It Works</a></li>
          <li><a href="index.html#about">About</a></li>
        </ul>
        <div class="nav-actions">
          <a href="login.html" class="btn btn-ghost">Login</a>
          <a href="register.html" class="btn btn-primary">Register</a>
        </div>
      </div>
    </nav>
  </header>

  <main id="main" class="auth-main">
    <div class="container">
      <div class="form-card">
        <h1>Admin login</h1>
        <p class="muted">For campus staff. Admin accounts are created by the system team; there is no public sign-up.</p>

        <div id="form-alert" class="alert" role="alert" hidden></div>

        <form id="login-form" data-role="admin" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required
              maxlength="254" aria-describedby="email-error">
            <p class="field-error" id="email-error" hidden></p>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="input-row">
              <input id="password" name="password" type="password" autocomplete="current-password" required
                minlength="8" maxlength="15" aria-describedby="password-error">
              <button class="btn btn-secondary btn-toggle" type="button"
                data-toggle-password="password" aria-controls="password">Show</button>
            </div>
            <p class="field-error" id="password-error" hidden></p>
          </div>
          <button class="btn btn-primary btn-lg btn-block" id="submit-btn" type="submit">Log in</button>
        </form>

        <p class="form-links">Not an admin? <a href="login.html">Student login</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <p>&copy; <span id="year">2026</span> Team TriForge | CCIRS. All rights reserved.</p>
    </div>
  </footer>

</body>

</html>
